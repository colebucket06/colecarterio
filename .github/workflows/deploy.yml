name: Build & Deploy colecarter.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/pathways/package-lock.json

      # ---- Pathways.io ----
      - run: npm ci
        working-directory: apps/pathways
      - run: npm run build
        working-directory: apps/pathways

      # ---- assemble the site: portal at /, each app in its own subpath ----
      - name: Assemble site
        run: |
          mkdir -p _site/pathways
          cp -r site/* _site/
          cp -r apps/pathways/dist/* _site/pathways/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
